<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Evelyn Leite</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .tela-carregando {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: var(--texto-suave); font-size: 13px; background: var(--creme);
  }
</style>
</head>
<body>

<!-- Isso aparece sozinho enquanto a sessão é conferida. O painel de verdade
     só entra depois que o Supabase confirmar que você está logada. -->
<div id="carregandoSessao" class="tela-carregando">Verificando sua sessão...</div>

<div id="appAdmin" hidden>
  <button class="menu-toggle" id="btnMenuToggle" aria-label="Abrir menu" aria-expanded="false">
    <svg class="icone" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="overlay-menu" id="overlayMenu"></div>

  <div class="admin-wrap">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-topo">
        <span class="marca-admin">Evelyn Leite</span>
      </div>
      <nav class="sidebar-nav" aria-label="Navegação do painel">
        <div class="sidebar-secao">
          <div class="sidebar-secao-titulo">Meu site</div>
          <button class="nav-item" data-aba="portfolio">
            <svg class="icone" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 13l2.5 3L14 11l4 6"/><circle cx="8.5" cy="8.5" r="1.2"/></svg>
            Portfólio
          </button>
          <button class="nav-item" data-aba="marcas">
            <svg class="icone" viewBox="0 0 24 24"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.2"/><path d="M20.5 20v-2a3.5 3.5 0 0 0-2.5-3.35"/><path d="M15.5 3.6a3.2 3.2 0 0 1 0 6.1"/></svg>
            Marcas
          </button>
        </div>
        <div class="sidebar-secao">
          <div class="sidebar-secao-titulo">Minha rotina</div>
          <button class="nav-item" data-aba="calendario">
            <svg class="icone" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
            Calendário
          </button>
          <button class="nav-item" data-aba="campanhas">
            <svg class="icone" viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V6a2.5 2.5 0 0 1 2.5-2.5h2A2.5 2.5 0 0 1 15.5 6v1.5"/><line x1="3" y1="12.5" x2="21" y2="12.5"/></svg>
            Campanhas
          </button>
          <button class="nav-item" data-aba="checklist">
            <svg class="icone" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8"/><path d="M8 12.5h8"/><path d="M8 16.5h5"/></svg>
            Checklist
          </button>
        </div>
      </nav>
      <div class="sidebar-rodape">
        <div class="email-usuaria" id="emailUsuaria">...</div>
        <button class="btn btn-outline" id="btnSair">Sair</button>
      </div>
    </aside>

    <main class="conteudo">
      <div class="conteudo-topo">
        <h1 id="tituloAba">Portfólio</h1>
        <p id="subtituloAba">Como o seu site público está indo.</p>
      </div>

      <div id="avisoEstrutura" class="faixa faixa-aviso" style="display:none; margin-bottom:18px;"></div>

      <section id="abaPortfolio" class="aba-conteudo"></section>
      <section id="abaMarcas" class="aba-conteudo" hidden></section>
      <section id="abaCalendario" class="aba-conteudo" hidden></section>
      <section id="abaCampanhas" class="aba-conteudo" hidden></section>
      <section id="abaChecklist" class="aba-conteudo" hidden></section>
    </main>
  </div>
</div>

<div id="areaModais"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script src="../js/biblioteca.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
